name: Deploy Cloudflare Worker

# Runs whenever worker.js or wrangler.toml change on main.
# Adjust the paths/branch below if your setup differs.
on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.toml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Required: this token is an Account API Token (cfat_ prefix),
          # which can't be auto-detected via /memberships like a user
          # token can — the account ID must be supplied explicitly.
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}