<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mIRC - Private Chat Room</title>
<style>
:root{
  --deskbg:#008080; --win:#c0c0c0; --border-lt:#fff; --border-dk:#404040; --border-mid:#808080;
  --title1:#000080; --title2:#1084d0; --logbg:#000; --logtext:#c0c0c0; --sys:#00c000;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --deskbg:#003030; } }
:root[data-theme="dark"]{ --deskbg:#003030; }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--deskbg);font-family:Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100%;padding:10px;}
.win{width:100%;max-width:840px;background:var(--win);border:2px solid var(--border-lt);border-right-color:var(--border-dk);border-bottom-color:var(--border-dk);box-shadow:3px 3px 10px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;}
.titlebar{background:linear-gradient(90deg,var(--title1),var(--title2));color:#fff;font-weight:bold;font-size:13px;padding:3px 5px;padding-top:calc(3px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:5px;}
.titlebar .ic{font-size:13px;}
.titlebar .btns{margin-left:auto;display:flex;gap:2px;}
.titlebar .btns span{background:var(--win);color:#000;border:1px solid;border-color:var(--border-lt) var(--border-dk) var(--border-dk) var(--border-lt);width:16px;height:14px;font-size:10px;text-align:center;line-height:14px;}
.menubar{font-size:12px;padding:3px 6px;border-bottom:1px solid var(--border-mid);display:flex;gap:14px;color:#000;}
.menubar span{text-decoration:none;}
.toolbar{display:flex;gap:3px;padding:3px 5px;border-bottom:1px solid var(--border-mid);}
.toolbar .tbtn{width:24px;height:22px;background:var(--win);border:1px solid;border-color:var(--border-lt) var(--border-dk) var(--border-dk) var(--border-lt);display:flex;align-items:center;justify-content:center;font-size:12px;}
.banner{display:flex;border-bottom:1px solid var(--border-mid);background:#000;}
.banner .info{padding:8px 6px;font-family:'Courier New',monospace;font-size:13px;line-height:1.35;}
.banner .info .chan{color:#4aa3ff;font-weight:bold;font-size:15px;}
.banner .info .topic{color:#e8e8e8;}
.body{display:flex;min-height:380px;max-height:64vh;}
#log{flex:1;overflow-y:auto;background:var(--logbg);padding:6px 8px;font-family:'Courier New',monospace;font-size:13px;color:var(--logtext);}
#log .line{margin-bottom:2px;white-space:pre-wrap;word-break:break-word;}
#log .sys{color:var(--sys);}
.nicklist{width:150px;background:#fff;border-left:1px solid var(--border-mid);overflow-y:auto;font-family:'Courier New',monospace;font-size:13px;padding:2px 0;}
.nicklist .n{padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;}
.inputrow{border-top:1px solid var(--border-lt);display:flex;}
#msgInput{flex:1;border:2px inset var(--border-mid);background:#fff;color:#000;font-family:'Courier New',monospace;font-size:13px;padding:4px 6px;margin:2px;outline:none;}
.statusbar{display:flex;justify-content:space-between;padding:3px 6px;font-size:11px;border-top:1px solid var(--border-mid);background:var(--win);}
/* sign-on */
#signon{padding:22px 18px;text-align:center;background:#000;color:#0f0;font-family:'Courier New',monospace;}
#signon .lg{font-size:22px;font-weight:bold;color:#4aa3ff;margin-bottom:6px;}
#signon p{font-size:12px;color:#c0c0c0;margin:4px 0 14px;}
#nickInput{padding:6px;font-size:14px;border:2px inset #808080;width:75%;max-width:260px;font-family:'Courier New',monospace;}
.err{color:#f55;font-size:11px;height:14px;margin-top:6px;}
#signon button, .send{background:var(--win);border:1px solid;border-color:var(--border-lt) var(--border-dk) var(--border-dk) var(--border-lt);padding:5px 14px;font-size:12px;cursor:pointer;margin:2px;}
#signon button:active,.send:active{border-color:var(--border-dk) var(--border-lt) var(--border-lt) var(--border-dk);}
#signon button{margin-top:12px;}
::-webkit-scrollbar{width:14px;}
::-webkit-scrollbar-track{background:#ddd;}
::-webkit-scrollbar-thumb{background:var(--win);border:2px outset #fff;}
</style>
</head>

<script>
const COLORS=["#4aa3ff","#ffd24a","#7fdc7f","#ff8ac6","#c9a4ff","#5ee8e0","#ff9b5e","#c0c0c0"];
function colorFor(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length];}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function timeStr(ts){const d=new Date(ts);return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}

let nick="", myColor="";
const log=document.getElementById('log');
const memberList=document.getElementById('memberList');
const msgSoundEl=document.getElementById('msgSound');
const loginSoundEl=document.getElementById('loginSound');
const keySoundEl=document.getElementById('keySound');
let prevMsgCount=null;
function playMsgSound(){ try{ msgSoundEl.currentTime=0; msgSoundEl.play().catch(()=>{}); }catch(e){} }
function playLoginSound(){ try{ loginSoundEl.currentTime=0; loginSoundEl.play().catch(()=>{}); }catch(e){} }
function playKeySound(){ try{ const c=keySoundEl.cloneNode(true); c.play().catch(()=>{}); c.addEventListener('ended', ()=>c.remove()); }catch(e){} }
document.getElementById('nickInput').addEventListener('input', playKeySound);
document.getElementById('msgInput').addEventListener('input', playKeySound);

function addSys(text){ const d=document.createElement('div'); d.className='line sys'; d.textContent='*** '+text; log.appendChild(d); log.scrollTop=log.scrollHeight; }

function renderMessages(msgs){
  log.innerHTML='';
  addSys('Now talking in #0p72-1rc');
  addSys("Topic is 'All Things Option'");
  if(msgs && msgs.length){
    for(const m of msgs){
      const d=document.createElement('div');
      d.className='line';
      d.innerHTML=`<span style="color:${esc(m.color)}">&lt;${esc(m.nick)}&gt;</span> <span style="color:#c0c0c0">${esc(m.text)}</span>`;
      log.appendChild(d);
    }
  }
  log.scrollTop=log.scrollHeight;
}

function renderMembers(peers){
  memberList.innerHTML='';
  if(!peers.length){ memberList.innerHTML='<div class="n">(just you)</div>'; return; }
  for(const p of peers){
    const nm=(p.presence&&p.presence.nickname)?p.presence.nickname:'guest';
    const col=(p.presence&&p.presence.color)?p.presence.color:'#000';
    const d=document.createElement('div'); d.className='n';
    d.innerHTML=`<span style="color:${esc(col)}">${p.isMe?'@':'+'}${esc(nm)}</span>`;
    memberList.appendChild(d);
  }
}

// --- Real cross-device networking via a Cloudflare Worker (Durable Object) ---
// After you deploy worker.js (see wrangler.toml in the same download), replace
// the placeholder below with your Worker's URL, e.g.
//   const WORKER_WS_URL = "wss://mirc-chat-worker.YOUR-SUBDOMAIN.workers.dev/ws";
const WORKER_WS_URL = "wss://mirc-chat-worker.scarishawt.workers.dev/ws";

let ws = null;
let wsReady = false;
let reconnectTimer = null;

function connectWebSocket(){
  if(WORKER_WS_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    addSys('not configured — set WORKER_WS_URL in index.html to your deployed worker');
    memberList.innerHTML='<div class="n">(not connected)</div>';
    renderMessages([]);
    return;
  }
  try{ ws = new WebSocket(WORKER_WS_URL); }
  catch(e){ addSys('connection failed'); return; }

  ws.addEventListener('open', ()=>{
    wsReady = true;
    ws.send(JSON.stringify({type:'join', nickname:nick, color:myColor}));
    document.getElementById('statusLeft').textContent = `Status: ${nick} on #0p72-1rc (connected)`;
  });

  ws.addEventListener('message', (evt)=>{
    let data; try{ data = JSON.parse(evt.data); }catch(e){ return; }
    if(data.type === 'history'){
      prevMsgCount = (data.messages||[]).length;
      renderMessages(data.messages||[]);
    } else if(data.type === 'message'){
      if(prevMsgCount!==null) playMsgSound();
      prevMsgCount = (prevMsgCount||0)+1;
      const rows = log.querySelectorAll('.line').length; // cheap append instead of full re-render
      appendMessage(data.message);
    } else if(data.type === 'presence'){
      renderMembers((data.peers||[]).map(p=>({presence:p, isMe:p.nickname===nick})));
    }
  });

  ws.addEventListener('close', ()=>{
    wsReady = false;
    document.getElementById('statusLeft').textContent = `Status: ${nick} on #0p72-1rc (disconnected)`;
    addSys('disconnected — reconnecting in a moment...');
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectWebSocket, 2000);
  });

  ws.addEventListener('error', ()=>{ addSys('connection error'); });
}

function appendMessage(m){
  const d=document.createElement('div');
  d.className='line';
  d.innerHTML=`<span style="color:${esc(m.color)}">&lt;${esc(m.nick)}&gt;</span> <span style="color:#c0c0c0">${esc(m.text)}</span>`;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}

async function initCapabilities(){
  connectWebSocket();
}

async function sendMessage(text){
  if(ws && wsReady){
    ws.send(JSON.stringify({type:'message', text}));
  } else {
    addSys('not connected — message not sent');
  }
}

document.getElementById('enterBtn').addEventListener('click', enterRoom);
document.getElementById('nickInput').addEventListener('keydown', e=>{ if(e.key==='Enter') enterRoom(); });

async function enterRoom(){
  const val=document.getElementById('nickInput').value.trim();
  if(!val){ document.getElementById('nickErr').textContent='enter a nickname'; return; }
  if(val.length<2){ document.getElementById('nickErr').textContent='too short'; return; }
  nick=val; myColor=colorFor(nick);
  playLoginSound();
  document.getElementById('signon').style.display='none';
  document.getElementById('chatBody').style.display='flex';
  document.getElementById('inputRow').style.display='flex';
  document.getElementById('statusBar').style.display='flex';
  document.getElementById('titleText').textContent=`mIRC32 - [#0p72-1rc (${nick})]`;
  document.getElementById('statusLeft').textContent=`Status: ${nick} on #0p72-1rc`;
  const upd=()=>{document.getElementById('statusTime').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});};
  upd(); setInterval(upd,15000);
  await initCapabilities();
  document.getElementById('msgInput').focus();
}

document.getElementById('sendBtn').addEventListener('click', doSend);
document.getElementById('msgInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doSend(); });
function doSend(){
  const inp=document.getElementById('msgInput');
  const text=inp.value.trim();
  if(!text) return;
  inp.value='';
  sendMessage(text);
}
</script>
</body>
